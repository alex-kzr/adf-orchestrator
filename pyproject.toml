[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adf-orchestrator"
version = "0.1.0"
description = "ADF durable declarative LangGraph orchestrator"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.2.14", "langgraph-checkpoint-postgres==3.1.2", "langchain==1.4.4", "langsmith==0.14.7",
  "pydantic==2.14.0", "httpx==0.28.1", "redis==8.1.0", "psycopg[binary,pool]==3.3.6",
  "opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.scripts]
adf-orchestrator = "adf_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.15.7", "bandit==1.9.4"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
